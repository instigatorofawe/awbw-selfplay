name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # upstream has no floating major tag
        with:
          enable-cache: true
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # Builds the extension, which regenerates python/awbw/_core.pyi.
      - run: uv sync --locked
      - name: Committed extension stub is up to date
        run: git diff --exit-code -- python/awbw/_core.pyi
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -v

  cpp:
    name: cpp (${{ matrix.os }}, ${{ matrix.config }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        config: [sanitize, release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          if [ "${{ matrix.config }}" = sanitize ]; then
            cmake -S . -B build/cpp -DCMAKE_BUILD_TYPE=Debug -DAWBW_SANITIZE=ON -DAWBW_BUILD_TESTS=ON
          else
            cmake -S . -B build/cpp -DCMAKE_BUILD_TYPE=Release -DAWBW_BUILD_TESTS=ON -DAWBW_BUILD_BENCHMARKS=ON
          fi
      - run: cmake --build build/cpp --parallel 4
      - run: ctest --test-dir build/cpp --output-on-failure
      - name: Benchmarks (smoke run)
        if: matrix.config == 'release'
        run: build/cpp/awbw_bench --benchmark_min_time=0.05s
