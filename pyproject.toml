[build-system]
requires = ["scikit-build-core>=1.1", "nanobind>=3.1"]
build-backend = "scikit_build_core.build"

[project]
name = "awbw-selfplay"
version = "0.1.0"
description = "Exact, fast Advance Wars By Web engine for replay parsing and self-play"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
# torch for awbw.nn on Linux, from PyTorch's index (`[tool.uv.sources]`):
# `uv sync --extra cpu` (CI) or `uv sync --extra cuda` (CUDA 13, which
# Blackwell GPUs need). `uv run` keeps whichever is installed; a plain
# `uv sync` removes it.
cpu = ["torch>=2.14; sys_platform == 'linux'"]
cuda = ["torch>=2.14; sys_platform == 'linux'"]

[project.scripts]
awbw = "awbw.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7",
    "pyrefly>=1.3.2",
    "pytest>=8",
    "ruff>=0.17",
]
# The critic and policy networks (awbw.nn) on macOS, whose PyPI wheels include
# the Metal (MPS) backend. Linux takes an extra instead.
nn = ["torch>=2.14; sys_platform == 'darwin'"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/awbw"]
wheel.py-api = "cp312"
cmake.build-type = "Release"

[tool.uv]
default-groups = ["dev", "nn"]
# Rebuild the extension on `uv sync` / `uv run` when C++ sources change.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "CMakeLists.txt" },
  { file = "src/**/*.h" },
  { file = "src/**/*.cpp" },
]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["python", "tests/python"]
extend-exclude = ["python/awbw/_core.pyi"]  # generated by the build

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyrefly]
project-includes = ["python", "tests/python"]
search-path = ["python", "tests/python"]
python-version = "3.12"
