# Generated by nanobind's stubgen during the build; formatting it would make
# every build produce a diff.
exclude: ^python/awbw/_core\.pyi$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files  # replays and datasets belong in cache/, not git
        args: [--maxkb=500]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c++, c]

  # Runs in the project venv (not an isolated hook env) so it sees numpy and
  # the package's own stubs.
  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly check
        entry: uv run --frozen pyrefly check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
