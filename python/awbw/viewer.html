<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Viewer</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #dedbd2;
  --accent: #2f6fd0; --accent2: #c2410c; --chip: #efede6; --shadow: 0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #201f1d; --ink: #ecebe6; --muted: #9c9a92; --line: #34322e;
    --accent: #6ea0ff; --accent2: #fb923c; --chip: #2a2926; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --panel: #201f1d; --ink: #ecebe6; --muted: #9c9a92; --line: #34322e;
  --accent: #6ea0ff; --accent2: #fb923c; --chip: #2a2926; --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 16px; }
header h1 { font-size: 18px; margin: 0 0 2px; font-weight: 650; }
header .sub { color: var(--muted); font-size: 13px; }
.warn { color: var(--accent2); font-weight: 600; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; margin-top: 12px; }
@media (max-width: 900px) { .main { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
.board { padding: 10px; overflow: auto; position: relative; }
canvas#map { display: block; margin: 0 auto; image-rendering: pixelated; cursor: crosshair; }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.side .card { padding: 12px; }
.turn { font-weight: 650; font-size: 15px; }
.turn .wx { color: var(--muted); font-weight: 400; }
.player { display: grid; grid-template-columns: 12px 1fr auto; gap: 4px 8px; align-items: center; padding: 8px 0; }
.player + .player { border-top: 1px solid var(--line); }
.player .sw { width: 12px; height: 12px; border-radius: 3px; }
.player .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player .fx { font-variant-numeric: tabular-nums; }
.player .meta { grid-column: 2 / 4; color: var(--muted); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
.player.active .nm::after { content: " ◀"; color: var(--accent); }
.bar { grid-column: 2 / 4; height: 6px; background: var(--chip); border-radius: 3px; position: relative; overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
.bar b { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .5; }
.bar.on i { background: var(--accent2); }
.action { font-size: 14px; min-height: 42px; }
.action .who { font-weight: 600; }
.vals { color: var(--muted); font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
button { font: inherit; background: var(--chip); color: var(--ink); border: 1px solid var(--line);
  border-radius: 7px; padding: 5px 10px; cursor: pointer; min-width: 36px; }
button:hover { border-color: var(--accent); }
input[type=range] { width: 100%; margin-top: 8px; accent-color: var(--accent); }
.pos { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
.log { max-height: 260px; overflow: auto; font-size: 12.5px; padding: 0; margin: 0; list-style: none; }
.log li { padding: 3px 6px; border-radius: 5px; cursor: pointer; display: flex; gap: 6px; }
.log li:hover { background: var(--chip); }
.log li.cur { background: var(--chip); outline: 1px solid var(--accent); }
.log li .n { color: var(--muted); min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
.chart { margin-top: 16px; padding: 10px 12px; }
.chart h2, .side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
svg#vchart { width: 100%; height: 160px; display: block; cursor: pointer; }
.legend { color: var(--muted); font-size: 12px; display: flex; gap: 14px; }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 5px; background: currentColor; }
.tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.15); display: none; z-index: 5; max-width: 260px; }
.keys { color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>
  </header>
  <div class="main">
    <div class="card board"><canvas id="map"></canvas></div>
    <div class="side">
      <div class="card">
        <div class="turn" id="turn"></div>
        <div id="players"></div>
      </div>
      <div class="card">
        <h2>Action</h2>
        <div class="action" id="action"></div>
        <div class="vals" id="vals"></div>
        <input type="range" id="slider" min="0" value="0" aria-label="Position in the game">
        <div class="controls" style="margin-top:8px">
          <button id="bStart" title="Start (Home)">⏮</button>
          <button id="bTurnBack" title="Previous turn (↑)">⇤</button>
          <button id="bBack" title="Previous action (←)">◀</button>
          <button id="bPlay" title="Play / pause (space)">▶︎</button>
          <button id="bNext" title="Next action (→)">▶</button>
          <button id="bTurnNext" title="Next turn (↓)">⇥</button>
          <button id="bEnd" title="End (End)">⏭</button>
          <span class="pos" id="pos"></span>
        </div>
        <div class="keys">← → action · ↑ ↓ turn · space play</div>
      </div>
      <div class="card">
        <h2>This turn</h2>
        <ul class="log" id="log"></ul>
      </div>
    </div>
  </div>
  <div class="card chart">
    <h2>Value for player 1 (−1 loss … +1 win)</h2>
    <svg id="vchart" preserveAspectRatio="none"></svg>
    <div class="legend"><span style="color:var(--accent)">searched</span><span style="color:var(--muted)">network</span></div>
  </div>
</div>
<div class="tip" id="tip"></div>
<script>
/*BOARD_JS*/
const G = /*GAME_DATA*/null;
const $ = (id) => document.getElementById(id);
const F = G.frames, M = G.map;
const cv = $("map"), B = makeBoard(G, cv), color = B.color, escapeHtml = B.escape;
const turnStarts = [0];
for (let i = 1; i < F.length; i++) if (F[i].a !== F[i - 1].a || F[i].d !== F[i - 1].d) turnStarts.push(i);

// Header
const res = G.result;
const pname = (p) => `${G.players[p].co} (${G.players[p].country || "player " + (p + 1)})`;
$("title").textContent = (M.name ? M.name + " · " : "Map " + M.id + " · ") + pname(0) + " vs " + pname(1);
const won = res.winner === 2 ? "Draw" : `${pname(res.winner)} won`;
let sub = `${won} on day ${res.days} (${res.decided}) · ${F.length - 1} actions`;
if (G.players[0].name || G.players[1].name) sub += ` · P1: ${G.players[0].name || "?"} · P2: ${G.players[1].name || "?"}`;
$("sub").textContent = sub;
if (!G.matches) {
  const w = document.createElement("div");
  w.className = "warn";
  w.textContent = "The replay didn't end at the recorded final state: this game was recorded under other engine rules.";
  $("sub").after(w);
}

// Board
function sizeBoard() { B.size(cv.parentElement.clientWidth - 20); }
function drawBoard(f) { B.draw(f); B.drawMarks(f.k); }
B.animate(() => drawBoard(F[cur]));

// Side panel
const WEATHER = ["clear", "rain", "snow"];
function playerCard(f, p) {
  const [funds, power, on, cop, scop] = f.p[p];
  const units = f.u.filter((u) => u[2] === p).length;
  const props = f.o.filter((o) => o === p).length;
  const full = Math.max(scop || cop || 1, 1);
  const pct = Math.min(100, 100 * power / full);
  const copMark = cop && scop ? `<b style="left:${100 * cop / scop}%"></b>` : "";
  const onText = on === 1 ? " · COP on" : on === 2 ? " · SCOP on" : "";
  return `<div class="player${f.a === p ? " active" : ""}">
    <span class="sw" style="background:${color(p)}"></span>
    <span class="nm">${G.players[p].co} · ${G.players[p].country || "P" + (p + 1)}</span>
    <span class="fx">${funds.toLocaleString()} G</span>
    <div class="bar${on ? " on" : ""}"><i style="width:${pct}%"></i>${copMark}</div>
    <div class="meta"><span>${units} units</span><span>${props} properties</span><span>power ${power.toLocaleString()}${onText}</span></div>
  </div>`;
}
const fmt = (v) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2);
function actionLine(f) {
  if (f.m < 0) return "Start of the game";
  return `<span class="who" style="color:${color(f.m)}">P${f.m + 1}</span> ${escapeHtml(f.t)}`;
}
function turnIndex(i) { let t = 0; while (t + 1 < turnStarts.length && turnStarts[t + 1] <= i) t++; return t; }
let cur = 0, timer = null, logTurn = -1;
function renderLog(i) {
  const t = turnIndex(i);
  const a = turnStarts[t], b = t + 1 < turnStarts.length ? turnStarts[t + 1] : F.length;
  if (t !== logTurn) {
    logTurn = t;
    let html = "";
    for (let j = a; j < b; j++) html += `<li data-i="${j}"><span class="n">${j}</span><span>${j === 0 ? "Start" : escapeHtml(F[j].t)}</span></li>`;
    $("log").innerHTML = html;
  }
  for (const li of $("log").children) {
    const on = +li.dataset.i === i;
    li.classList.toggle("cur", on);
    if (on) li.scrollIntoView({ block: "nearest" });
  }
}
function show(i) {
  cur = Math.max(0, Math.min(F.length - 1, i));
  const f = F[cur];
  drawBoard(f);
  $("turn").innerHTML = `Day ${f.d} · <span style="color:${color(f.a)}">Player ${f.a + 1}</span> <span class="wx">· ${WEATHER[f.w] || ""}</span>`;
  $("players").innerHTML = playerCard(f, 0) + playerCard(f, 1);
  $("action").innerHTML = actionLine(f);
  $("vals").textContent = f.v === undefined ? "" :
    `value for P1 before it: ${fmt(f.v)} searched${f.n ? ` (${f.n} sims)` : ""}, ${fmt(f.nv)} network`;
  $("slider").value = cur;
  $("pos").textContent = `${cur} / ${F.length - 1}`;
  try { history.replaceState(null, "", "#" + cur); } catch (e) { /* a sandboxed page */ }
  renderLog(cur);
  drawCursor();
}

// Value chart
const svg = $("vchart"), NS = "http://www.w3.org/2000/svg";
let cursorLine = null;
function el(tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
function drawChart() {
  svg.innerHTML = "";
  const w = svg.clientWidth || 800, h = svg.clientHeight || 160, n = Math.max(F.length - 1, 1);
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  const X = (i) => (i / n) * w, Y = (v) => h / 2 - v * (h / 2 - 6);
  svg.append(el("line", { x1: 0, x2: w, y1: Y(0), y2: Y(0), stroke: "var(--line)" }));
  let lastDay = 0;
  F.forEach((f, i) => {
    if (f.d !== lastDay) {
      lastDay = f.d;
      if (i > 0) svg.append(el("line", { x1: X(i), x2: X(i), y1: 0, y2: h, stroke: "var(--line)", "stroke-dasharray": "2 3" }));
      const t = el("text", { x: X(i) + 2, y: 11, fill: "var(--muted)", "font-size": 10 });
      t.textContent = f.d;
      if (f.d % Math.max(1, Math.round(res.days / 15)) === 0 || f.d === 1) svg.append(t);
    }
  });
  for (const [key, stroke, width] of [["nv", "var(--muted)", 1], ["v", "var(--accent)", 1.8]]) {
    let d = "";
    F.forEach((f, i) => { if (f[key] !== undefined) d += (d ? "L" : "M") + X(i).toFixed(1) + " " + Y(f[key]).toFixed(1); });
    if (d) svg.append(el("path", { d, fill: "none", stroke, "stroke-width": width }));
  }
  cursorLine = el("line", { y1: 0, y2: h, stroke: "var(--accent2)", "stroke-width": 1.5 });
  svg.append(cursorLine);
  drawCursor();
}
function drawCursor() {
  if (!cursorLine) return;
  const w = svg.clientWidth || 800, n = Math.max(F.length - 1, 1);
  cursorLine.setAttribute("x1", (cur / n) * w); cursorLine.setAttribute("x2", (cur / n) * w);
}
svg.addEventListener("click", (e) => {
  const r = svg.getBoundingClientRect();
  stop(); show(Math.round(((e.clientX - r.left) / r.width) * (F.length - 1)));
});

// Tooltip
const tip = $("tip");
cv.addEventListener("mousemove", (e) => {
  const at = B.tileAt(e);
  if (!at) { tip.style.display = "none"; return; }
  tip.innerHTML = B.tileInfo(F[cur], at[0], at[1]);
  tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 270) + "px";
  tip.style.top = e.clientY + 14 + "px";
});
cv.addEventListener("mouseleave", () => { tip.style.display = "none"; });

// Controls
function stop() { if (timer) { clearInterval(timer); timer = null; $("bPlay").textContent = "▶︎"; } }
function play() {
  if (timer) return stop();
  if (cur >= F.length - 1) show(0);
  $("bPlay").textContent = "❚❚";
  timer = setInterval(() => { if (cur >= F.length - 1) stop(); else show(cur + 1); }, 350);
}
const turnBack = () => { const t = turnIndex(cur); show(turnStarts[cur === turnStarts[t] ? Math.max(0, t - 1) : t]); };
const turnNext = () => { const t = turnIndex(cur); show(t + 1 < turnStarts.length ? turnStarts[t + 1] : F.length - 1); };
$("bStart").onclick = () => { stop(); show(0); };
$("bEnd").onclick = () => { stop(); show(F.length - 1); };
$("bBack").onclick = () => { stop(); show(cur - 1); };
$("bNext").onclick = () => { stop(); show(cur + 1); };
$("bTurnBack").onclick = () => { stop(); turnBack(); };
$("bTurnNext").onclick = () => { stop(); turnNext(); };
$("bPlay").onclick = play;
$("slider").max = F.length - 1;
$("slider").oninput = (e) => { stop(); show(+e.target.value); };
$("log").onclick = (e) => { const li = e.target.closest("li"); if (li) { stop(); show(+li.dataset.i); } };
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" && e.key !== " ") return;
  const k = e.key;
  if (k === "ArrowRight") { stop(); show(cur + 1); }
  else if (k === "ArrowLeft") { stop(); show(cur - 1); }
  else if (k === "ArrowDown" || k === "PageDown") { stop(); turnNext(); }
  else if (k === "ArrowUp" || k === "PageUp") { stop(); turnBack(); }
  else if (k === "Home") { stop(); show(0); }
  else if (k === "End") { stop(); show(F.length - 1); }
  else if (k === " ") play();
  else return;
  e.preventDefault();
});
window.addEventListener("resize", () => { sizeBoard(); show(cur); drawChart(); });
sizeBoard();
drawChart();
show(parseInt(location.hash.slice(1), 10) || 0);
</script>
</body>
</html>
