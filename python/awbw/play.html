<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play the Network</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #dedbd2;
  --accent: #2f6fd0; --accent2: #c2410c; --chip: #efede6; --shadow: 0 1px 2px rgba(0,0,0,.06);
  --move: rgba(80, 150, 255, .38); --range: rgba(255, 60, 40, .28); --good: #15803d;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #201f1d; --ink: #ecebe6; --muted: #9c9a92; --line: #34322e;
    --accent: #6ea0ff; --accent2: #fb923c; --chip: #2a2926; --shadow: none; --good: #4ade80;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --panel: #201f1d; --ink: #ecebe6; --muted: #9c9a92; --line: #34322e;
  --accent: #6ea0ff; --accent2: #fb923c; --chip: #2a2926; --shadow: none; --good: #4ade80;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 16px; }
header h1 { font-size: 18px; margin: 0 0 2px; font-weight: 650; }
header .sub { color: var(--muted); font-size: 13px; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; margin-top: 12px; }
@media (max-width: 900px) { .main { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
.board { padding: 10px; overflow: auto; position: relative; }
canvas#map { display: block; margin: 0 auto; image-rendering: pixelated; cursor: pointer; }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.side .card { padding: 12px; }
.side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
.turn { font-weight: 650; font-size: 15px; }
.turn .wx { color: var(--muted); font-weight: 400; }
.player { display: grid; grid-template-columns: 12px 1fr auto; gap: 4px 8px; align-items: center; padding: 8px 0; }
.player + .player { border-top: 1px solid var(--line); }
.player .sw { width: 12px; height: 12px; border-radius: 3px; }
.player .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player .fx { font-variant-numeric: tabular-nums; }
.player .meta { grid-column: 2 / 4; color: var(--muted); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.player.active .nm::after { content: " ◀"; color: var(--accent); }
.bar { grid-column: 2 / 4; height: 6px; background: var(--chip); border-radius: 3px; position: relative; overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
.bar b { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .5; }
.bar.on i { background: var(--accent2); }
.status { min-height: 22px; font-weight: 600; }
.status.thinking::after { content: ""; display: inline-block; width: 10px; height: 10px; margin-left: 8px; border-radius: 50%;
  border: 2px solid var(--accent); border-right-color: transparent; animation: spin .8s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }
.status .wx { color: var(--muted); font-weight: 400; font-size: 13px; }
.hint { color: var(--muted); font-size: 12.5px; margin-top: 2px; min-height: 18px; }
.err { color: var(--accent2); font-size: 12.5px; min-height: 0; }
.controls { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
button { font: inherit; background: var(--chip); color: var(--ink); border: 1px solid var(--line);
  border-radius: 7px; padding: 5px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.power { border-color: var(--accent2); }
.value { color: var(--muted); font-size: 12px; margin-top: 8px; display: flex; gap: 8px; align-items: center; }
.value b { color: var(--ink); font-variant-numeric: tabular-nums; }
.log { max-height: 300px; overflow: auto; font-size: 12.5px; padding: 0; margin: 0; list-style: none; }
.log li { padding: 2px 6px; display: flex; gap: 6px; }
.log li.day { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding-top: 6px; }
.log li .who { font-weight: 600; min-width: 22px; }
.menu { position: absolute; z-index: 4; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 6px 20px rgba(0,0,0,.2); padding: 4px; display: none; min-width: 150px; }
.menu button { display: flex; justify-content: space-between; gap: 14px; width: 100%; border: 0; background: none;
  text-align: left; border-radius: 5px; padding: 5px 8px; }
.menu button:hover:not(:disabled) { background: var(--chip); }
.menu button .c { color: var(--muted); font-variant-numeric: tabular-nums; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 3px 0; }
.tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.15); display: none; z-index: 5; max-width: 280px; }
.tip .dmg { font-weight: 600; }
.over { font-size: 16px; font-weight: 700; }
.keys { color: var(--muted); font-size: 12px; margin-top: 8px; }
dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px; width: min(460px, calc(100vw - 32px)); box-shadow: 0 10px 30px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog h2 { font-size: 16px; margin: 0 0 12px; font-weight: 650; }
.form { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr); gap: 8px 10px; align-items: center; }
.form .lb { color: var(--muted); font-size: 13px; }
.form .wide { grid-column: 2 / 4; }
.form .head { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.form select, .form input[type=text] { font: inherit; width: 100%; min-width: 0; background: var(--chip); color: var(--ink);
  border: 1px solid var(--line); border-radius: 7px; padding: 5px 6px; }
.form .sides { grid-column: 2 / 4; display: flex; gap: 14px; flex-wrap: wrap; }
.form .note { grid-column: 1 / 4; color: var(--muted); font-size: 12.5px; }
dialog .controls { justify-content: flex-end; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>
  </header>
  <div class="main">
    <div class="card board" id="boardCard"><canvas id="map"></canvas><div class="menu" id="menu"></div></div>
    <div class="side">
      <div class="card">
        <div class="turn" id="turn"></div>
        <div id="players"></div>
      </div>
      <div class="card">
        <div class="status" id="status"></div>
        <div class="hint" id="hint"></div>
        <div class="err" id="err"></div>
        <div class="controls">
          <button id="bEnd" class="primary">End turn</button>
          <button id="bCop" class="power">CO Power</button>
          <button id="bScop" class="power">Super CO Power</button>
        </div>
        <div class="controls">
          <button id="bUndo" title="Undo your last action (U)">Undo</button>
          <button id="bDelete" title="Scrap the selected unit">Delete unit</button>
          <button id="bResign">Resign</button>
          <button id="bNew">New game</button>
        </div>
        <label class="value"><input type="checkbox" id="showValue"> Show the network's estimate <b id="value"></b></label>
        <div class="keys">Esc cancels · U undoes · right-click a unit for its range</div>
      </div>
      <div class="card">
        <h2>Actions</h2>
        <ul class="log" id="log"></ul>
      </div>
    </div>
  </div>
</div>
<div class="tip" id="tip"></div>
<dialog id="setup" aria-labelledby="setupTitle">
  <h2 id="setupTitle">New game</h2>
  <div class="form">
    <span class="lb">Map</span><select id="sMap" class="wide"></select>
    <span class="lb">or id</span><input type="text" id="sMapId" class="wide" inputmode="numeric" autocomplete="off"
      placeholder="any AWBW map id (downloaded if new)">
    <span></span><span class="head">CO</span><span class="head">Army</span>
    <span class="lb">Player 1</span><select id="sCo0"></select><select id="sArmy0"></select>
    <span class="lb">Player 2</span><select id="sCo1"></select><select id="sArmy1"></select>
    <span class="lb">You play</span>
    <div class="sides">
      <label><input type="radio" name="sSide" value="0"> Player 1 (moves first)</label>
      <label><input type="radio" name="sSide" value="1"> Player 2</label>
    </div>
    <div class="note" id="sNote"></div>
  </div>
  <div class="err" id="sErr"></div>
  <div class="controls"><button id="sCancel">Cancel</button><button id="sStart" class="primary">Start</button></div>
</dialog>
<script>
/*BOARD_JS*/
const G = /*GAME_DATA*/null;
const $ = (id) => document.getElementById(id);
const cv = $("map"), B = makeBoard(G, cv), esc = B.escape, color = B.color;
B.exactHp = false;  // players see displayed HP only, as the network does
const HUMAN = G.human, AGENT = 1 - HUMAN, M = G.map;
const WEATHER = ["clear", "rain", "snow"];
const MOVE = "rgba(150,200,255,.62)", RANGE = "rgba(255,90,70,.42)";  // shading of move and attack ranges
let V = null;          // the latest view from the server
let targeting = null;  // the menu entry whose target is being chosen
let info = null;       // ranges of a unit looked at
let hover = null;      // [x, y] under the pointer
let anim = null;       // {u: unit row, at: [x, y]} while an agent's unit moves
let busy = false, agentRunning = false;
const key = (t) => t[0] + "," + t[1];

async function api(path, body) {
  const opts = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch("/api/" + path, opts);
  const out = await r.json();
  if (!r.ok) throw new Error(out.error || r.statusText);
  return out;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const pname = (p) => `${G.players[p].co} · ${p === HUMAN ? "you" : G.players[p].name || "the network"}`;

// Header
$("title").textContent = (M.name ? M.name + " · " : "Map " + M.id + " · ") +
  `${G.players[0].co} vs ${G.players[1].co}`;
$("sub").innerHTML = `You play ${esc(G.players[HUMAN].co)} (${esc(G.players[HUMAN].country)}, player ${HUMAN + 1}) against ` +
  `${esc(G.players[AGENT].name || "the network")} as ${esc(G.players[AGENT].co)}`;

function sizeBoard() { B.size($("boardCard").clientWidth - 20, 40); }

// What the person is doing, from the view
const opts = () => (V && V.options) || null;
const phase = () => (V ? V.phase : "idle");
function selectedRow() {
  const o = opts();
  if (!o || !o.unit) return null;
  return V.frame.u.find((u) => u[3] === o.unit[0] && u[4] === o.unit[1] && !(u[8] & B.CARRIED)) || null;
}
function moveAt(t) { const o = opts(); return o && o.moves ? o.moves.find((m) => m.to[0] === t[0] && m.to[1] === t[1]) : null; }
function targetAt(t) { return targeting ? targeting.targets.find((x) => x.at[0] === t[0] && x.at[1] === t[1]) : null; }

function render() {
  if (!V) return;
  renderBoard();
  renderSide();
}
function renderBoard() {
  if (!V) return;
  const f = V.frame, o = opts(), ph = phase();
  const sel = selectedRow();
  const skip = anim ? anim.u[0] : ph === "moved" && sel ? sel[0] : undefined;
  B.draw(f, skip, () => {
    if (info) { B.shade(info.moves, MOVE); B.shade(info.attack.filter((t) => !info.moveSet.has(key(t))), RANGE); }
    if (o && ph === "selected") {
      const moveSet = new Set(o.moves.map((m) => key(m.to)));
      B.shade(o.attack.filter((t) => !moveSet.has(key(t))), RANGE);
      B.shade(o.moves.map((m) => m.to), MOVE);
    }
  });
  if (o && ph === "selected") {
    const m = hover && moveAt(hover);
    if (m) B.path(m.path, "rgba(255,255,255,.85)");
    B.outline([o.unit], "#ffd23f", 3);
  }
  if (o && ph === "moved" && sel) {
    B.drawUnit(sel, o.at, false);
    B.outline([o.at], "#ffd23f", 3);
    if (targeting) {
      const fill = targeting.channel === "Fire" || targeting.channel === "AttackSeam" ? "#ff3b30" : targeting.channel === "Launch" ? "#ff9f0a" : "#34c759";
      if (targeting.channel === "Launch") {
        if (hover && targetAt(hover)) B.shade(blast(hover), "rgba(255,159,10,.4)");
      } else B.outline(targeting.targets.map((t) => t.at), fill, 3);
    }
  }
  if (o && ph === "factory") B.outline([o.factory], "#ffd23f", 3);
  if (anim) B.drawUnit(anim.u, anim.at, false, anim.dir);
  const last = V.log[V.log.length - 1];
  if (last && last.m === AGENT && ph === "idle" && !anim) B.drawMarks(last.k);
}
function blast(c) {
  const out = [];
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
    const x = c[0] + dx, y = c[1] + dy;
    if (Math.abs(dx) + Math.abs(dy) <= 2 && x >= 0 && y >= 0 && x < B.W && y < B.H) out.push([x, y]);
  }
  return out;
}

function playerCard(p) {
  const f = V.frame, [funds, power, on, cop, scop] = f.p[p];
  const units = f.u.filter((u) => u[2] === p).length;
  const full = Math.max(scop || cop || 1, 1), pct = Math.min(100, 100 * power / full);
  const copMark = cop && scop ? `<b style="left:${100 * cop / scop}%"></b>` : "";
  const onText = on === 1 ? " · COP on" : on === 2 ? " · SCOP on" : "";
  const stars = (x) => (x / 90000).toFixed(1).replace(/\.0$/, "");
  const st = V.players[p];
  return `<div class="player${f.a === p ? " active" : ""}">
    <span class="sw" style="background:${color(p)}"></span>
    <span class="nm">${esc(pname(p))}</span>
    <span class="fx">${funds.toLocaleString()} G</span>
    <div class="bar${on ? " on" : ""}"><i style="width:${pct}%"></i>${copMark}</div>
    <div class="meta"><span>+${st.income.toLocaleString()} G a day</span><span>${units} unit${units === 1 ? "" : "s"}</span>
      <span>army ${st.army.toLocaleString()} G</span><span>meter ${stars(power)} ★ of ${stars(cop)} / ${stars(scop)}${onText}</span></div>
  </div>`;
}

function renderSide() {
  const f = V.frame, o = opts(), ph = phase();
  const whose = V.over ? "Game over" : f.a === HUMAN ? "Your turn" : "The network's turn";
  $("turn").innerHTML = `Day ${f.d} · <span style="color:${V.over ? "inherit" : color(f.a)}">${whose}</span>` +
    ` <span class="wx">· ${WEATHER[f.w] || ""}</span>`;
  $("players").innerHTML = playerCard(HUMAN) + playerCard(AGENT);
  const st = $("status");
  st.classList.toggle("thinking", agentRunning);
  if (V.over) {
    const last = V.log[V.log.length - 1];
    const won = V.winner === HUMAN, how = V.decided === "resigned" ? (won ? "the network resigned" : "you resigned") :
      last ? `${last.m === HUMAN ? "you" : "the network"}: ${last.t}` : "";
    st.innerHTML = `<span class="over" style="color:${won ? "var(--good)" : "var(--accent2)"}">${won ? "You won" : V.winner === AGENT ? "The network won" : "A draw"}</span>` +
      (how ? ` <span class="wx">(${how})</span>` : "");
  } else st.textContent = agentRunning || f.a === AGENT ? "The network is thinking" : "Your move";
  $("hint").textContent = V.over || !o ? "" : ph === "idle" ? "Pick a unit or a factory." :
    ph === "selected" ? "Pick where to move (its own tile to stay). Esc cancels." :
    ph === "moved" ? (targeting ? `Pick a target for ${targeting.name}. Esc goes back.` : "Pick an action.") : "Pick a unit to build.";
  const mine = !!o && !busy;
  $("bEnd").disabled = !mine || o.end_turn == null;
  $("bCop").disabled = !mine || o.cop == null;
  $("bScop").disabled = !mine || o.scop == null;
  $("bUndo").disabled = busy || agentRunning || !V.can_undo;
  $("bResign").disabled = !mine;
  $("bDelete").style.display = mine && ph === "selected" && o.delete != null ? "" : "none";
  $("value").textContent = $("showValue").checked && V.value != null ? (V.value >= 0 ? "+" : "−") + Math.abs(V.value).toFixed(2) : "";
  renderLog();
  renderMenu();
}

let loggedCount = -1;
function renderLog() {
  if (V.actions === loggedCount) return;
  loggedCount = V.actions;
  let html = "", turn = "";
  for (const e of V.log) {
    if (e.d + "," + e.m !== turn) {
      turn = e.d + "," + e.m;
      html += `<li class="day">Day ${e.d} · ${e.m === HUMAN ? "you" : "the network"}</li>`;
    }
    html += `<li><span class="who" style="color:${color(e.m)}">${e.m === HUMAN ? "You" : "Net"}</span><span>${esc(e.t)}</span></li>`;
  }
  $("log").innerHTML = html;
  $("log").scrollTop = $("log").scrollHeight;
}

// The floating menu: a moved unit's actions, or a factory's builds
function placeMenu(at) {
  const m = $("menu"), T = B.T;
  const left = cv.offsetLeft + (at[0] + 1) * T + 6, top = cv.offsetTop + B.top + at[1] * T;
  m.style.left = Math.min(left, cv.offsetLeft + cv.offsetWidth - 160) + "px";
  m.style.top = top + "px";
}
function renderMenu() {
  const m = $("menu"), o = opts(), ph = phase();
  if (!o || busy || (ph !== "moved" && ph !== "factory") || targeting) { m.style.display = "none"; return; }
  let html = "";
  if (ph === "moved") {
    o.menu.forEach((e, i) => { html += `<button data-i="${i}">${esc(e.name)}</button>`; });
    placeMenu(o.at);
  } else {
    for (const b of o.builds) html += `<button data-build="${b.id}" ${b.id == null ? "disabled" : ""}><span>${esc(b.name)}</span><span class="c">${b.cost.toLocaleString()}</span></button>`;
    placeMenu(o.factory);
  }
  html += `<hr><button data-cancel="1">Cancel</button>`;
  m.innerHTML = html;
  m.style.display = "block";
  tip.style.display = "none";
}
$("menu").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b || b.disabled) return;
  if (b.dataset.cancel) return cancel();
  if (b.dataset.build !== undefined) return pick(+b.dataset.build);
  const entry = opts().menu[+b.dataset.i];
  if (entry.targets) {
    if (entry.targets.length === 1 && entry.channel !== "Fire" && entry.channel !== "Launch") return pick(entry.targets[0].id);
    targeting = entry; render();
  } else pick(entry.id);
});

// Requests
function showError(msg) { $("err").textContent = msg || ""; }
async function send(path, body) {
  if (busy) return null;
  busy = true; showError("");
  try {
    const out = await api(path, body);
    V = out.view;
    return out;
  } catch (e) { showError(e.message); return null; }
  finally { busy = false; targeting = null; render(); }
}
async function pick(id) { await send("pick", { id }); info = null; render(); runAgent(); }
async function cancel() { targeting = null; if (phase() !== "idle") await send("cancel", {}); render(); }

async function runAgent() {
  if (agentRunning || !V || V.over || V.frame.a !== AGENT) return;
  agentRunning = true; render();
  try {
    while (V && !V.over && V.frame.a === AGENT) {
      const before = V.frame;
      const out = await api("think", {});
      if (!out.done) { V = out.view; break; }
      await animate(before, out.done);
      V = out.view; render();
      await sleep(120);
    }
  } catch (e) { showError(e.message); }
  agentRunning = false; anim = null; render();
}
async function animate(before, done) {
  const path = done.path || [];
  if (path.length < 2) return;
  const u = before.u.find((r) => r[3] === path[0][0] && r[4] === path[0][1] && !(r[8] & B.CARRIED));
  if (!u) return;
  for (let i = 0; i < path.length; i++) {  // V.frame is still before's
    const at = path[i], [a, c] = i + 1 < path.length ? [at, path[i + 1]] : [path[i - 1], at];
    const dx = c[0] - a[0], dy = c[1] - a[1];
    anim = { u, at, dir: dx > 0 ? "E" : dx < 0 ? "W" : dy < 0 ? "N" : "S" };
    renderBoard();
    await sleep(70);
  }
  anim = null;
}

// Board input
cv.addEventListener("click", async (e) => {
  const t = B.tileAt(e);
  if (!t || busy || !opts()) return;
  const o = opts(), ph = phase();
  if (ph === "idle") {
    const s = o.select.find((x) => x[0] === t[0] && x[1] === t[1]);
    if (s) { info = null; return send("pick", { id: s[2] }); }
    return lookAt(t);
  }
  if (ph === "selected") {
    const m = moveAt(t);
    if (m) return send("pick", { id: m.id });
    await cancel();
    const s = opts() && opts().select.find((x) => x[0] === t[0] && x[1] === t[1]);
    if (s) send("pick", { id: s[2] });
    return;
  }
  if (ph === "moved" && targeting) {
    const x = targetAt(t);
    if (x) return pick(x.id);
    targeting = null; render();
  }
});
async function lookAt(t) {
  const unit = V.frame.u.find((u) => u[3] === t[0] && u[4] === t[1] && !(u[8] & B.CARRIED));
  if (!unit || (info && key(info.unit) === key(t))) { info = null; render(); return; }
  try {
    const r = await api(`unit?x=${t[0]}&y=${t[1]}`);
    info = r && { ...r, moveSet: new Set(r.moves.map(key)) };
  } catch (e) { info = null; }
  render();
}
cv.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  if (phase() !== "idle") return back();
  const t = B.tileAt(e);
  if (t) lookAt(t);
});
function back() {
  if (targeting) { targeting = null; render(); return; }
  if (phase() !== "idle") return cancel();
  if (info) { info = null; render(); }
}

const tip = $("tip");
cv.addEventListener("mousemove", (e) => {
  const t = B.tileAt(e);
  const changed = !hover || !t || key(hover) !== key(t);
  hover = t;
  if (!t) { tip.style.display = "none"; return; }
  if (changed && V && !anim) renderBoard();
  let html = B.tileInfo(V.frame, t[0], t[1]);
  const x = targetAt(t);
  if (x && x.preview) html = previewHtml(x.preview, t) + "<br>" + html;
  if (x && x.seam !== undefined) html = `<span class="dmg">Seam −${x.seam} HP</span><br>` + html;
  tip.innerHTML = html;
  tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 290) + "px";
  tip.style.top = e.clientY + 14 + "px";
});
cv.addEventListener("mouseleave", () => { tip.style.display = "none"; hover = null; renderBoard(); });
function spread(rows) {
  const ks = rows.map((r) => r[0]);
  const lo = Math.min(...ks), hi = Math.max(...ks);
  return lo === hi ? String(lo) : `${lo}–${hi}`;
}
function previewHtml(p, t) {
  const d = V.frame.u.find((u) => u[3] === t[0] && u[4] === t[1] && !(u[8] & B.CARRIED));
  const name = d ? esc(G.units[d[1]]) : "Target";
  let html = `<span class="dmg">Damage ${p.damage[0] === p.damage[1] ? p.damage[0] : p.damage[0] + "–" + p.damage[1]}%</span>`;
  html += `<br>${name}: ${p.hp} → ${spread(p.after)}` + (p.kill > 0 ? ` (destroyed ${Math.round(p.kill * 100)}%)` : "");
  if (p.counter.some((r) => r[0] !== p.own)) html += `<br>Counter: yours ${p.own} → ${spread(p.counter)}`;
  return html;
}

// Buttons and keys
$("bEnd").onclick = () => {
  const o = opts();
  if (!o || o.end_turn == null) return;
  if (o.unmoved > 0 && !confirm(`${o.unmoved} of your units can still act. End your turn?`)) return;
  pick(o.end_turn);
};
$("bCop").onclick = () => { const o = opts(); if (o && o.cop != null && confirm("Use the CO Power?")) pick(o.cop); };
$("bScop").onclick = () => { const o = opts(); if (o && o.scop != null && confirm("Use the Super CO Power?")) pick(o.scop); };
$("bUndo").onclick = () => send("undo", {});
$("bDelete").onclick = async () => {
  const o = opts();
  if (!o || o.delete == null || !confirm("Delete this unit?")) return;
  const id = o.delete;
  await send("cancel", {});
  pick(id);
};
$("bResign").onclick = () => { if (confirm("Resign this game?")) send("resign", {}); };

// New game: a form with what the server offers, filled in with this game's setup
const option = (value, text) => `<option value="${value}">${esc(text)}</option>`;
const realGame = () => $("sMap").value === "" && !$("sMapId").value.trim();
function choose(el, v) { el.value = v == null ? "" : String(v); if (el.selectedIndex < 0) el.value = ""; }
function setupLabels() {  // what leaving a CO or an army unchosen means
  const real = realGame();
  for (const i of [0, 1]) {
    $("sCo" + i).options[0].text = real ? "The game's" : "Random";
    $("sArmy" + i).options[0].text = real ? "The game's" : "The map's";
  }
}
function mapChanged() {  // another map: its own armies; a real game's: its COs too
  for (const i of [0, 1]) { $("sArmy" + i).value = ""; if (realGame()) $("sCo" + i).value = ""; }
  setupLabels();
}
$("sMap").onchange = () => { $("sMapId").value = ""; mapChanged(); };
$("sMapId").oninput = mapChanged;
$("bNew").onclick = async () => {
  let out;
  try { out = await api("setup"); } catch (e) { showError(e.message); return; }
  const c = out.choices, cur = out.current;
  const maps = c.maps.some((m) => m.id === cur.map) ? c.maps :
    c.maps.concat([{ id: cur.map, name: M.name || "Map " + cur.map, w: M.width, h: M.height }]);
  $("sMap").innerHTML = option("", "A real game's setup, at random") +
    maps.map((m) => option(m.id, `${m.name} · ${m.w}×${m.h}`)).join("");
  for (const i of [0, 1]) {
    $("sCo" + i).innerHTML = option("", "") + c.cos.map((x) => option(x.id, x.name)).join("");
    $("sArmy" + i).innerHTML = option("", "") + c.countries.map((x) => option(x.id, x.name)).join("");
    choose($("sCo" + i), cur.cos[i]);
    choose($("sArmy" + i), cur.countries[i]);
  }
  choose($("sMap"), cur.map);
  $("sMapId").value = "";
  document.querySelector(`input[name=sSide][value="${cur.human}"]`).checked = true;
  setupLabels();
  $("sNote").textContent = V && !V.over ? "This game will be left unfinished; unfinished games aren't recorded." : "";
  $("sErr").textContent = "";
  $("sStart").disabled = false; $("sStart").textContent = "Start";
  $("setup").showModal();
};
$("sCancel").onclick = () => $("setup").close();
$("sStart").onclick = async () => {
  const body = {
    map: $("sMapId").value.trim() || $("sMap").value || null,
    cos: [0, 1].map((i) => $("sCo" + i).value || null),
    countries: [0, 1].map((i) => $("sArmy" + i).value || null),
    human: +document.querySelector("input[name=sSide]:checked").value,
  };
  $("sStart").disabled = true; $("sStart").textContent = "Starting…"; $("sErr").textContent = "";
  try {
    await api("new", body);
    location.reload();
  } catch (e) {
    $("sErr").textContent = e.message;
    $("sStart").disabled = false; $("sStart").textContent = "Start";
  }
};
$("showValue").onchange = () => { try { localStorage.setItem("showValue", $("showValue").checked ? "1" : ""); } catch (e) { /* no storage */ } render(); };
try { $("showValue").checked = localStorage.getItem("showValue") === "1"; } catch (e) { /* no storage */ }
document.addEventListener("keydown", (e) => {
  if ($("setup").open) return;  // the form's own keys
  if (e.key === "Escape") back();
  else if ((e.key === "u" || e.key === "U" || (e.key === "z" && (e.metaKey || e.ctrlKey))) && !$("bUndo").disabled) send("undo", {});
  else return;
  e.preventDefault();
});
window.addEventListener("resize", () => { sizeBoard(); render(); });

sizeBoard();
B.animate(renderBoard);
api("view").then((out) => { V = out; render(); runAgent(); }).catch((e) => showError(e.message));
</script>
</body>
</html>
